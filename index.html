<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LEBED.ai — Neural Interface v0.1-beta</title>
<style>
    /* Reset & Base Styles */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { height: 100%; width: 100%; overflow: hidden; font-family: 'Inter', sans-serif; background: #0a0a0a; color: white; }
    
    #canvas-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }

    .app-layout { display: flex; height: 100vh; width: 100vw; overflow: hidden; }

    /* Sidebar - Desktop Default */
    .sidebar { width: 260px; background: rgba(0,0,0,0.8); border-right: 1px solid #333; display: flex; flex-direction: column; padding: 15px; }

    /* Main Workspace */
    .main-workspace { flex: 1; display: flex; flex-direction: column; height: 100%; position: relative; overflow: hidden; }
    
    /* Mobile Responsive Logic */
    @media (max-width: 768px) {
        .sidebar { 
            position: absolute; 
            left: -260px; /* Hidden by default on mobile */
            height: 100%; 
            z-index: 100; 
            transition: 0.3s;
        }
        .sidebar.active { left: 0; }
        
        .prompt-box { width: 95% !important; margin: 0 auto; }
        .hero-greeting { font-size: 1.2rem; }
    }

    /* Basic layout helpers */
    .chat-viewport { flex: 1; overflow-y: auto; padding: 20px; }
    .input-wrapper { padding: 20px; background: rgba(0,0,0,0.5); }
    .prompt-box { display: flex; background: #1a1a1a; padding: 10px; border-radius: 8px; border: 1px solid #333; }
    .prompt-input { flex: 1; background: transparent; border: none; color: white; padding: 10px; outline: none; }

    /* Modal Styles */
    .modal-overlay { display: none; position: fixed; top:0; left:0; width: 100%; height:100%; background: rgba(0,0,0,0.7); z-index: 2000; justify-content: center; align-items: center; }
    .modal-card { width: 90%; max-width: 500px; background: #1a1a1a; padding: 20px; border-radius: 12px; }
    
    /* Utility */
    .btn { cursor: pointer; padding: 10px 20px; border: none; border-radius: 5px; }
</style>
</head>
<body>

<canvas id="canvas-bg"></canvas>

<div class="app-layout">
  
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="brand">
        <div class="logo-core">L</div>
        <div class="brand-title">LEBED<span>.ai</span></div>
      </div>
      <button id="toggleSidebar" style="background:none; border:none; color:#ccc; cursor:pointer;">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"></path></svg>
      </button>
    </div>

    <button class="new-chat-btn" id="newChatBtn" style="margin: 20px 0; width: 100%; padding: 10px;">
       + New chat
    </button>
  </aside>

  <main class="main-workspace">
    <header style="padding: 15px;">
      <div class="status-badge">LEBED Core v0.1-beta</div>
    </header>

    <div class="chat-viewport" id="chatViewport">
      <div class="chat-container">
        <div class="hero-greeting" id="heroGreeting">
          <div class="typewriter-title">How can I assist you today?</div>
        </div>
        <div class="message-list" id="messageList"></div>
      </div>
    </div>

    <div class="input-wrapper">
      <div class="prompt-box">
        <input type="text" id="userInput" class="prompt-input" placeholder="Ask anything..." autocomplete="off">
        <button class="action-btn" id="sendBtn">Send</button>
      </div>
    </div>
  </main>
</div>

<script>
    // Logic to toggle sidebar on mobile
    const toggleBtn = document.getElementById('toggleSidebar');
    const sidebar = document.getElementById('sidebar');

    toggleBtn.addEventListener('click', () => {
        sidebar.classList.toggle('active');
    });
</script>

</body>
</html>
